name: homelab-clickhouse

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.7
    container_name: homelab-clickhouse
    hostname: clickhouse
    restart: unless-stopped
    env_file: .env
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
      TZ: Europe/Moscow
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./config.d/resources.xml:/etc/clickhouse-server/config.d/resources.xml:ro
    networks:
      db:
      proxy:
        aliases: [clickhouse]
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    # TCP 9000 and HTTP 8123 NOT exposed on host.

volumes:
  clickhouse-data:
  clickhouse-logs:

networks:
  db:
    external: true
    name: homelab-db
  proxy:
    external: true
    name: outline-network
