# SECURITY: The ClickHouse HTTP endpoint can execute SQL. Prefer VPN/private
# DNS and an external authentication layer before exposing this to the Internet.
server {
    listen 80;
    server_name clickdb.handyman.moscow;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name clickdb.handyman.moscow;
    ssl_certificate /etc/nginx/certs/handyman.moscow.pem;
    ssl_certificate_key /etc/nginx/certs/handyman.moscow-key.pem;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $target http://clickhouse:8123;
        proxy_pass $target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
